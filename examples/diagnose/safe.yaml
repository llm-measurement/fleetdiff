# Synthetic supported fixture; no claim about live traffic or deployment safety.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: "127.0.0.1:14317"}
processors:
  batch: {timeout: 1s}
connectors:
  genaisketch:
    operation_filter:
      llm_operations: [chat, generate_content, text_completion, embeddings]
    slices:
      - name: by_model
        keys: [gen_ai.request.model]
exporters:
  prometheus:
    endpoint: "127.0.0.1:18889"
    translation_strategy: UnderscoreEscapingWithoutSuffixes
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [genaisketch]
    metrics:
      receivers: [genaisketch]
      exporters: [prometheus]
