name: Bug report
description: Report a reproducible CLI, capture, demo, or installation problem.
body:
  - type: markdown
    attributes:
      value: "Use synthetic data. Do not include secrets, raw prompts, identities, private summaries, or unredacted logs. Report vulnerabilities through SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: fleetdiff version or source revision, OS/architecture, and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Command and flags, redacted configuration, and synthetic traces or summaries.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed result
      description: Include the accounting view, window, units, and missing-usage state when relevant.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Checks already run
      description: Focused test results and any known limits. Sanitize paths and log excerpts.
