# SPDX-License-Identifier: Apache-2.0
# Code authors: Vijay and Codex
# PROPOSED STANDALONE SHADOW CONFIGURATION: REVIEW BEFORE RUNNING.
# Keep the current collector and backend unchanged. Add a separate shadow
# branch from an authorized source to this new local collector. Do not merge
# this file over the existing configuration or overwrite the current file.
# REVIEW: choose unused loopback ports and review model-operation mappings.
# REVIEW: model label values must be bounded and non-sensitive in actual traffic.
# REVIEW: set GENAI_SKETCH_SECRET in the collector's environment to an approved
# secret of at least 32 bytes. secret_env is a variable NAME, never a literal key.
# REVIEW: create ./private-shadow-summaries with mode 0700 and one writer.
# REVIEW: replace REVIEW_SCOPE and REVIEW_KEY_ID with non-sensitive agreed IDs.
# Inventory must independently confirm exactly one producer named shadow,
# observing disjoint requests. Never infer expected producers from export files.
# Summaries are pseudonymous, unsigned, and unencrypted; restrict access.
# After validating and reviewing, retain two completed windows separately and use:
# fleetdiff investigate --before ./before --after ./after --expected shadow
receivers:
  otlp:
    protocols:
      grpc: {endpoint: "127.0.0.1:14317"}
      http: {endpoint: "127.0.0.1:14318"}
processors:
  batch: {timeout: 1s}
connectors:
  genaisketch:
    window_duration: 60s
    retention_windows: 10
    max_slices: 200
    topk: 0
    hashing:
      algo: hmac_sha256_64
      secret_env: GENAI_SKETCH_SECRET
    operation_filter:
      llm_operations: [chat, generate_content, text_completion, embeddings]
    slices:
      - name: by_model
        keys: [gen_ai.request.model]
    fields:
      user_key:
        from_attributes: [enduser.id, user.id]
        from_resource_attributes: [enduser.id, user.id]
        canonicalization: text_v1
        domain: user:v1
      prompt_key:
        from_attributes: [gen_ai.request.prompt]
        from_resource_attributes: [gen_ai.request.prompt]
        canonicalization: text_v1
        domain: prompt:v1
      doc_key:
        from_attributes: [retrieval.doc_id]
        from_resource_attributes: [retrieval.doc_id]
        canonicalization: text_v1
        domain: retrieval-doc:v1
    weights:
      input_tokens_from: [gen_ai.usage.input_tokens, gen_ai.usage.prompt_tokens]
      output_tokens_from: [gen_ai.usage.output_tokens, gen_ai.usage.completion_tokens]
      fallback_when_missing: request_count_only
    dedup: {enabled: false}
    summary_export:
      directory: ./private-shadow-summaries
      producer_id: shadow
      scope_id: REVIEW_SCOPE
      key_id: REVIEW_KEY_ID
      interval: 5s
exporters:
  prometheus:
    endpoint: "127.0.0.1:18889"
    translation_strategy: UnderscoreEscapingWithoutSuffixes
service:
  telemetry:
    logs: {level: error}
    metrics: {level: none}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [genaisketch]
    metrics:
      receivers: [genaisketch]
      exporters: [prometheus]
