name: release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
      - run: |
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Build archives
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=dev
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          sh scripts/build-release.sh "$version"
      - name: Unpack binaries for dependency inventory
        run: |
          mkdir -p .cache/inventory
          for archive in dist/*.tar.gz; do
            target=".cache/inventory/$(basename "$archive" .tar.gz)"
            mkdir "$target"
            tar -xzf "$archive" -C "$target"
          done
      - name: Inventory binary dependencies
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        with:
          path: .cache/inventory
          format: spdx-json
          output-file: sbom.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Complete checksums
        run: |
          jq -e 'any(.packages[]; .name == "github.com/llm-measurement/llm-sketchkit") and
            any(.packages[]; .name == "google.golang.org/protobuf")' sbom.spdx.json >/dev/null
          mv sbom.spdx.json dist/
          cd dist
          sha256sum ./*.tar.gz build.txt sbom.spdx.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - name: Verify exact archive on its native platform
        env:
          TARGET: ${{ matrix.os }}_${{ matrix.arch }}
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS)
          mkdir unpacked
          tar -xzf dist/fleetdiff_*_"$TARGET".tar.gz -C unpacked
          sh scripts/smoke-binary.sh ./unpacked/fleetdiff
      - name: Offline unprivileged runtime
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ matrix.arch }}
        run: sh scripts/restricted-smoke.sh dist/fleetdiff_*_linux_"$ARCH".tar.gz "linux/$ARCH"

  publish:
    needs: [build, verify]
    # Public signing logs reveal repository metadata. Never use them for private builds.
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - run: cd dist && sha256sum -c SHA256SUMS
      - name: Sign build provenance for archives, inventory, and checksums
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Verify provenance and create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/provenance.jsonl
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GH_REPO" --bundle dist/provenance.jsonl \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" --deny-self-hosted-runners
          done
          gh release create "$TAG" dist/* --verify-tag --draft --title "$TAG" \
            --notes 'Read CHANGELOG.md and docs/OPERATIONS.md before use. Verify archive provenance and checksums before installation.'
